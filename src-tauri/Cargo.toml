[package]
name = "openpres-manager"
version = "0.6.0"
edition = "2021"
description = "OpenPres Manager: finds OpenPres servers on the network and manages them"

[[bin]]
name = "openpres-manager"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Log files (one a day).
tracing-appender = "0.2"
directories = "5"
# Asking this computer's server (and the last server, for its beta program) how it is.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# Servers announce themselves on the local network; the Manager finds them (mDNS / Bonjour).
mdns-sd = "0.13"
gethostname = "0.5"
# Updates from this repository's GitHub Releases (signed; see docs/RELEASING.md).
tauri-plugin-updater = "2"

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
