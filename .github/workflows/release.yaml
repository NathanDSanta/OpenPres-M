# Publishes a release (docs/RELEASING.md). The same in every OpenPres repository; only the
# build jobs (here: the web build and the desktop program) are this repository's own.
#   stable  X.Y.Z when main gets something: /release on Telegram (develop into main, Y+1) or
#           /hotfix (a hotfix pull request, Z+1). After a hotfix, main goes back into develop
#           and a beta follows straight away, so betas have the fix too.
#   beta    X.Y.Z.A from develop, when beta.yaml says it's time (a pre-release on GitHub).
# A major release (X+1): run this workflow by hand on main with "major", only when Nathan asks.
name: Release

on:
  push:
    branches: [ main ]
  workflow_call:
  workflow_dispatch:
    inputs:
      bump:
        description: "On main: major makes a major release (X+1.0.0), only when Nathan asks for one"
        type: choice
        options: [ auto, major ]
        default: auto

env:
  PRODUCT: "OpenPres Manager"
  FIRST_VERSION: "0.6.0"

jobs:
  plan:
    name: Plan the release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.plan.outputs.version }}
      name: ${{ steps.plan.outputs.name }}
      tag: ${{ steps.plan.outputs.tag }}
      semver: ${{ steps.plan.outputs.semver }}
      code: ${{ steps.plan.outputs.code }}
      beta: ${{ steps.plan.outputs.beta }}
      hotfix: ${{ steps.plan.outputs.hotfix }}
      notes: ${{ steps.plan.outputs.notes }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      # Stable from main, beta from develop (beta.yaml already decided that one is due).
      - name: Version and notes
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          MAIN_REF: origin/main
          BUMP: ${{ inputs.bump == 'major' && 'major' || '' }}
          NOW: "true"
        run: node scripts/release/plan.mjs ${{ github.ref_name == 'main' && 'stable' || 'beta' }}

      - name: Summary
        env:
          NAME: ${{ steps.plan.outputs.name }}
        run: echo "${NAME:-Nothing to release.}" >> "$GITHUB_STEP_SUMMARY"

  web:
    name: Web build
    needs: plan
    if: needs.plan.outputs.version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm'

      # The web build: the server bundles it, to serve it to browsers and iPads and to show
      # it in its own windows. With the release's version (the X.Y.Z form for X.Y.Z.A betas).
      - name: Web build
        env:
          SEMVER: ${{ needs.plan.outputs.semver }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          npm ci
          npm version --no-git-tag-version --allow-same-version "$SEMVER"
          npm run build
          mkdir release
          (cd dist && zip -qr "../release/OpenPres-Manager-web-${TAG#v}.zip" .)

      - uses: actions/upload-artifact@v4
        with:
          name: release-files-web
          path: release/

  # The desktop program, for every computer. Main platforms (Windows x64, macOS Apple
  # Silicon, Linux x64) must build; when an extra one fails, the rest still ship.
  desktop:
    name: Desktop (${{ matrix.id }})
    needs: plan
    if: needs.plan.outputs.version != ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - { id: windows-x64, runner: windows-latest, target: x86_64-pc-windows-msvc, main: true }
          - { id: macos-arm64, runner: macos-latest, target: aarch64-apple-darwin, main: true }
          - { id: linux-x64, runner: ubuntu-22.04, target: x86_64-unknown-linux-gnu, main: true }
          - { id: windows-arm64, runner: windows-11-arm, target: aarch64-pc-windows-msvc, main: false }
          - { id: macos-x64, runner: macos-latest, target: x86_64-apple-darwin, main: false }
          - { id: linux-arm64, runner: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu, main: false }
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ !matrix.main }}
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      # Signed update bundles, so installed Managers update themselves (latest.json).
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      TAG: ${{ needs.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm'

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'
          key: ${{ matrix.target }}

      # The GStreamer plugins go into the AppImage (bundleMediaFramework): a server's videos
      # play in the window whatever the computer has.
      - name: Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential file libssl-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev pkg-config patchelf rpm \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-libav gstreamer1.0-gl

      # Betas are carried as X.Y.(Z+1)-A, which sorts between the stables (docs/RELEASING.md).
      - name: Set the version
        run: node scripts/release/set-version.mjs "${{ needs.plan.outputs.semver }}"

      - run: npm ci

      - name: Build
        run: |
          args=(build --target "${{ matrix.target }}")
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            args+=(--config '{"bundle":{"createUpdaterArtifacts":true}}')
          else
            echo "::warning::TAURI_SIGNING_PRIVATE_KEY isn't set: installed Managers can't update to this release by themselves."
          fi
          npm run tauri -- "${args[@]}"

      - name: Name the files
        run: node scripts/release/assets.mjs collect "${{ matrix.id }}" "${TAG#v}" release

      - uses: actions/upload-artifact@v4
        with:
          name: release-files-${{ matrix.id }}
          path: release/OpenPres-Manager-*
          if-no-files-found: error

      # Update signatures go into latest.json, not on the release page.
      - uses: actions/upload-artifact@v4
        with:
          name: update-signatures-${{ matrix.id }}
          path: release/sigs/*
          if-no-files-found: ignore

  publish:
    name: Publish
    needs: [ plan, web, desktop ]
    if: ${{ !cancelled() && needs.plan.outputs.version != '' && needs.web.result == 'success' && needs.desktop.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.plan.outputs.tag }}
      NAME: ${{ needs.plan.outputs.name }}
      SEMVER: ${{ needs.plan.outputs.semver }}
      BETA: ${{ needs.plan.outputs.beta }}
      NOTES: ${{ needs.plan.outputs.notes }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      # Every build job's files (release-files-*), and the desktop builds' update signatures.
      - uses: actions/download-artifact@v4
        with:
          pattern: release-files*
          merge-multiple: true
          path: release

      - uses: actions/download-artifact@v4
        with:
          pattern: update-signatures-*
          merge-multiple: true
          path: sigs

      # latest.json: where installed Managers find the new version and its signed bundles.
      - name: Update file
        run: |
          mkdir -p sigs
          if RELEASE_NOTES="$NOTES" node scripts/release/updater-json.mjs "$SEMVER" sigs "$GITHUB_REPOSITORY" "$TAG" > latest.json; then
            cat latest.json
          else
            rm -f latest.json
            echo "::warning::No signed update bundles (TAURI_SIGNING_PRIVATE_KEY isn't set?): installed Managers won't see this release."
          fi

      - name: Publish on GitHub
        run: |
          (cd release && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt)
          if [ -f latest.json ]; then cp latest.json release/; fi
          {
            if [ "$BETA" = "true" ]; then echo "A **beta**: for the servers following the beta program (Settings → General)."; echo; fi
            printf '%s\n' "$NOTES"
          } > notes.md
          flags=()
          if [ "$BETA" = "true" ]; then flags=(--prerelease --latest=false); fi
          gh release create "$TAG" release/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$PRODUCT $NAME" --notes-file notes.md "${flags[@]}"
          echo "Published **$PRODUCT $NAME**." >> "$GITHUB_STEP_SUMMARY"

      # Managers of servers in the beta program read this fixed release's latest.json: every
      # release replaces it, so they get betas and the stables after them.
      - name: Beta feed
        if: ${{ hashFiles('latest.json') != '' }}
        run: |
          if ! gh release view beta-feed --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create beta-feed --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --latest=false \
              --title "Beta feed" --notes "Not a release: the newest version for the beta program (latest.json). Betas and stable releases are listed on the Releases page."
          fi
          gh release upload beta-feed latest.json --clobber --repo "$GITHUB_REPOSITORY"

      - name: Bring the hotfix into develop, and a beta with it
        if: needs.plan.outputs.hotfix == 'true'
        run: |
          if ! gh api -X POST "repos/$GITHUB_REPOSITORY/merges" -f base=develop -f head=main -f commit_message="Merge branch 'main' into develop (hotfix $NAME)" > /dev/null; then
            echo "::error::Couldn't merge main into develop (a conflict?). Merge it by hand, then run the Beta workflow with 'now', so betas get the fix."
            exit 1
          fi
          gh workflow run beta.yaml --repo "$GITHUB_REPOSITORY" --ref develop -f now=true
          echo "Merged main into develop; a beta with the fix is on its way." >> "$GITHUB_STEP_SUMMARY"
