# Checks for the Manager, on pull requests and after each merge. A beta needs them green
# (beta.yaml).
name: Checks

on:
  pull_request:
    branches: [ develop, main ]
  push:
    branches: [ develop, main ]
  workflow_dispatch:

# A new push to the same pull request cancels the checks still running for the old one.
concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (types + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm'

      - run: npm ci

      - name: Types and build
        run: npm run build

      - name: Release scripts
        run: node --test scripts/release/lib.test.mjs

  desktop:
    name: Desktop program (tests + clippy)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'

      - name: Linux libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev libgtk-3-dev librsvg2-dev pkg-config

      # The program embeds the web build; the checks above build the real one.
      - name: A stand-in web build
        run: mkdir -p dist && echo '<!doctype html><title>OpenPres Manager</title>' > dist/index.html

      - name: Tests
        working-directory: src-tauri
        run: cargo test --locked

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --locked --all-targets -- -D warnings
